<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prisme">
<meta name="theme-color" content="#0f172a">
<title>Prisme Budget</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#6366f1;--accfg:#fff;--pos:#16a34a;--neg:#dc2626;--warn:#d97706;--chip:#eef2ff}
@media(prefers-color-scheme:dark){:root{--bg:#020617;--card:#0f172a;--tx:#e2e8f0;--mut:#94a3b8;--line:#1e293b;--acc:#818cf8;--accfg:#0b1020;--pos:#4ade80;--neg:#f87171;--warn:#fbbf24;--chip:#1e1b4b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:22px}
#dot{width:12px;height:12px;border-radius:50%;background:#94a3b8;display:inline-block;margin-left:8px}
main{max-width:760px;margin:0 auto;padding:4px 14px 160px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 7px;font-size:11px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc);font-weight:600}
#fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 72px);width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--accfg);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:7;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gap{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.label{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:30px;font-weight:700;margin:2px 0}
.mut{color:var(--mut);font-size:14px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.chip{display:inline-block;background:var(--chip);color:var(--acc);border-radius:99px;padding:2px 9px;font-size:12px;border:0}
.chip.on{background:var(--acc);color:var(--accfg)}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:12px;padding:11px 16px;font-size:16px;font-weight:600}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.sec{background:var(--chip);color:var(--acc)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.ghost{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.badge{border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
.badge.ok{background:rgba(22,163,74,.12);color:var(--pos)}
.badge.ko{background:rgba(217,119,6,.14);color:var(--warn)}
.filters{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}
.filters select,.filters input{flex:1;min-width:120px}
input,select,textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;margin-top:4px}
label{display:block;margin:10px 0;font-size:13px;color:var(--mut)}
label.chkl{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--tx)}
label.chkl input{width:auto;margin:0}
.day{margin:14px 4px 4px;color:var(--mut);font-size:13px;font-weight:600;text-transform:capitalize}
.tx{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:4px 0}
.tx .mid{flex:1;min-width:0}
.tx .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{color:var(--mut);font-size:12px}
.tx .amt{font-weight:600;white-space:nowrap}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:15px;flex:none}
.chk.on{background:var(--pos);border-color:var(--pos);color:#fff}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar>i.warn{background:var(--warn)}.bar>i.over{background:var(--neg)}.bar>i.good{background:var(--pos)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.mnav button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;width:40px;height:36px;font-size:20px}
.mnav b{text-transform:capitalize}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.empty .big{font-size:50px}
.menu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:14px;margin:8px 0;font-size:16px}
.menu span{font-size:22px}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
.sheet h3{margin:0 0 6px}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:9px;font-size:15px}
.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none;max-width:90%;font-size:14px}
svg text{fill:var(--mut);font-size:10px}
h3{font-size:17px}
</style>
</head>
<body>
<header><h1 id="title">Prisme</h1><div><button class="ghost" onclick="manualSync()" title="Synchroniser">⟳</button><span id="dot"></span></div></header>
<main id="main"></main>
<button id="fab" onclick="fabClick()">+</button>
<nav>
  <button data-t="accounts" onclick="go('accounts')"><span>🏦</span>Comptes</button>
  <button data-t="tx" onclick="go('tx')"><span>🧾</span>Opérations</button>
  <button data-t="budgets" onclick="go('budgets')"><span>🎯</span>Budgets</button>
  <button data-t="stats" onclick="go('stats')"><span>📊</span>Analyses</button>
  <button data-t="more" onclick="go('more')"><span>⚙️</span>Plus</button>
</nav>
<div id="modal" onclick="closeModal()"></div>
<div id="toast"></div>

<script>
/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
const now=()=>Date.now();
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const ym=d=>String(d).slice(0,7);
function money(n){try{return new Intl.NumberFormat('fr-FR',{style:'currency',currency:CFG.currency||'EUR'}).format(n||0)}catch(e){return (n||0).toFixed(2)+' €'}}
const smoney=n=>(n>0?'+':'')+money(n);
const sum=a=>r2(a.reduce((s,t)=>s+t.amount,0));
const live=a=>a.filter(x=>!x.deleted);
function parseAmount(s){
  if(typeof s==='number')return s;
  s=String(s==null?'':s).trim().replace(/[€$£\s\u00a0\u202f]/g,'');
  if(!s)return NaN;
  const neg=/^\(.*\)$/.test(s);s=s.replace(/[()]/g,'');
  if(s.includes(',')&&s.includes('.')){ if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(s.includes(','))s=s.replace(',','.');
  const v=parseFloat(s);
  return neg?-Math.abs(v):v;
}
function parseDate(s){
  s=String(s==null?'':s).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+p2(m[2])+'-'+p2(m[1])}
  return null;
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const nS=first.split(';').length,nC=first.split(',').length,nT=first.split('\t').length;
  const delim=(nS>=nC&&nS>=nT&&nS>1)?';':(nT>nC?'\t':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else if(c==='"')q=true;
    else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur='';rows.push(row);row=[] }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function monthLabel(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
function monthShort(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('fr-FR',{month:'short'})}
function dayLabel(d){const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function addMonths(m,delta){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+delta,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)}
const optHTML=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`).join('');

/* ============ Données ============ */
const TABLES=['accounts','categories','recurring','transactions','budgets','goals'];
const LSD='prisme_data_v1',LSC='prisme_cfg_v1';
const CAT_E=[['🛒','Courses'],['🍽️','Restaurants'],['🚗','Transport'],['🏠','Logement'],['💡','Factures'],['💊','Santé'],['🎬','Loisirs'],['🔁','Abonnements'],['🛍️','Shopping'],['✈️','Voyages'],['🎁','Cadeaux'],['📦','Divers']];
const CAT_I=[['💼','Salaire'],['💰','Autres revenus']];
const TYPES=[['checking','Compte courant'],['savings','Épargne'],['cash','Espèces'],['loan','Prêt']];
const TYPE_LBL=Object.fromEntries(TYPES);
function seedCats(){
  const o=[];
  CAT_E.forEach((c,i)=>o.push({id:'00000000-0000-4000-8000-0000000001'+p2(i),name:c[1],icon:c[0],kind:'expense',updated_at:1,deleted:false}));
  CAT_I.forEach((c,i)=>o.push({id:'00000000-0000-4000-8000-0000000002'+p2(i),name:c[1],icon:c[0],kind:'income',updated_at:1,deleted:false}));
  return o;
}
function loadData(){
  let d=null;try{d=JSON.parse(localStorage.getItem(LSD))}catch(e){}
  if(!d||typeof d!=='object')d={};
  TABLES.forEach(t=>{if(!Array.isArray(d[t]))d[t]=[]});
  if(!d.categories.length)d.categories=seedCats();
  return d;
}
let CFG={url:'',key:'',email:'',auto:true,lastPull:0,lastPush:0,currency:'EUR'};
try{Object.assign(CFG,JSON.parse(localStorage.getItem(LSC)||'{}'))}catch(e){}
let S=loadData();
const saveCfg=()=>localStorage.setItem(LSC,JSON.stringify(CFG));
const saveData=()=>localStorage.setItem(LSD,JSON.stringify(S));
function persist(){saveData();scheduleSync()}
function put(kind,obj,quiet){
  obj.updated_at=now();
  const a=S[kind],i=a.findIndex(x=>x.id===obj.id);
  if(i>=0)a[i]=obj;else a.push(obj);
  if(!quiet)persist();
}
function del(kind,id){const o=S[kind].find(x=>x.id===id);if(o){o.deleted=true;o.updated_at=now()}persist()}

const ui={tab:'accounts',sub:null,accFilter:'',q:'',unc:false,limit:100,month:today().slice(0,7),txId:null,txType:'expense',txCat:'',imp:null};

/* ============ Calculs ============ */
const txOf=id=>live(S.transactions).filter(t=>t.account_id===id);
function bal(a){
  const tx=txOf(a.id);
  return{current:r2(a.initial_balance+sum(tx)),cleared:r2(a.initial_balance+sum(tx.filter(t=>t.cleared))),unc:tx.filter(t=>!t.cleared)};
}
const catById=id=>S.categories.find(c=>c.id===id);
const catName=id=>{const c=catById(id);return c?c.name:'Sans catégorie'};
const catIcon=id=>{const c=catById(id);return c?c.icon:'•'};
const accName=id=>{const a=S.accounts.find(x=>x.id===id);return a?a.name:'?'};
function spentBy(cat,m){let s=0;live(S.transactions).forEach(t=>{if(!t.transfer_id&&t.amount<0&&t.category_id===cat&&ym(t.date)===m)s-=t.amount});return r2(s)}
function monthSums(m){let inc=0,exp=0;live(S.transactions).forEach(t=>{if(t.transfer_id||ym(t.date)!==m)return;if(t.amount>0)inc+=t.amount;else exp-=t.amount});return{inc:r2(inc),exp:r2(exp)}}
function netAt(end){
  let s=0;live(S.accounts).forEach(a=>{s+=a.initial_balance});
  live(S.transactions).forEach(t=>{if(t.date<=end)s+=t.amount});
  return r2(s);
}
function recBooked(r){const m=ym(today());return live(S.transactions).some(t=>t.recurring_id===r.id&&ym(t.date)===m)}
function forecast(){let pend=0;const list=[];live(S.recurring).filter(r=>r.active).forEach(r=>{if(!recBooked(r)){pend+=r.amount;list.push(r)}});return{pend:r2(pend),list}}
function recDate(r){const d=new Date();const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(Math.min(r.day,last))}

/* ============ Navigation / rendu ============ */
function go(t){ui.tab=t;ui.sub=null;window.scrollTo(0,0);render()}
function fabClick(){if(ui.tab==='budgets')budgetModal();else txModal()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#modal').innerHTML='<div class="sheet" onclick="event.stopPropagation()">'+h+'</div>';$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
function shiftMonth(d){ui.month=addMonths(ui.month,d);render()}
const mnav=()=>`<div class="mnav"><button onclick="shiftMonth(-1)">‹</button><b>${esc(monthLabel(ui.month))}</b><button onclick="shiftMonth(1)">›</button></div>`;

function render(){
  const v=ui.tab;let h='';
  const titles={accounts:'Comptes',tx:'Opérations',budgets:'Budgets',stats:'Analyses',more:'Plus'};
  $('#title').textContent=titles[v];
  if(v==='accounts')h=viewAccounts();else if(v==='tx')h=viewTx();else if(v==='budgets')h=viewBudgets();else if(v==='stats')h=viewStats();else h=viewMore();
  $('#main').innerHTML=h;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===v));
  $('#fab').style.display=(v==='stats'||v==='more')?'none':'flex';
  updateDot();
}

/* ---- Comptes ---- */
function viewAccounts(){
  const accs=live(S.accounts).filter(a=>!a.archived);
  if(!accs.length)return`<div class="empty"><div class="big">👋</div><p>Bienvenue ! Ajoute ton premier compte pour commencer.</p><button class="btn" onclick="accountModal()">Ajouter un compte</button></div>`;
  let tot=0,totBank=0,hasBank=false,net=0,check=0;
  accs.forEach(a=>{const b=bal(a);net+=b.current;if(a.type!=='loan'){tot+=b.current;if(a.bank_balance!=null){totBank+=a.bank_balance;hasBank=true}}if(a.type==='checking'||a.type==='cash')check+=b.current});
  const f=forecast();
  let h=`<div class="card"><span class="label">Solde actuel (hors prêts)</span><div class="big">${money(r2(tot))}</div>
  <div class="grid2"><div><span class="label">Réel banque</span><b>${hasBank?money(r2(totBank)):'—'}</b></div><div><span class="label">Patrimoine net</span><b>${money(r2(net))}</b></div></div>`;
  if(live(S.recurring).some(r=>r.active)){
    h+=`<div class="badge ${f.pend<0?'ko':'ok'}" style="background:var(--chip);color:var(--tx)">Reste à passer ce mois : <b>${smoney(f.pend)}</b> · Solde prévu fin de mois (courants + espèces) : <b>${money(r2(check+f.pend))}</b></div>`;
  }
  h+='</div>';
  accs.forEach(a=>{
    const b=bal(a);const gap=a.bank_balance!=null?r2(a.bank_balance-b.cleared):null;
    h+=`<div class="card"><div class="row"><div><b>${esc(a.name)}</b> <span class="chip">${esc(TYPE_LBL[a.type]||a.type)}</span></div><button class="ghost" onclick="accountModal('${a.id}')">⋯</button></div>
    <span class="label">Solde actuel</span><div class="big ${b.current<0?'neg':''}">${money(b.current)}</div>
    <div class="grid2"><div><span class="label">Pointé</span><b>${money(b.cleared)}</b></div>
    <div><span class="label">Réel banque${a.bank_balance_date?' · '+esc(a.bank_balance_date.split('-').reverse().join('/')):''}</span><b>${a.bank_balance!=null?money(a.bank_balance):'—'}</b></div></div>`;
    if(gap!=null){
      h+=gap===0?`<div class="badge ok">✓ Rapproché avec la banque</div>`
        :`<div class="badge ko">Écart avec la banque : <b>${smoney(gap)}</b><br><span class="mut">Pointe les opérations vues sur ton relevé, ou ajoute celles qui manquent.</span></div>`;
    }
    if(b.unc.length)h+=`<div class="mut" style="margin-top:8px">${b.unc.length} opération(s) non pointée(s) (${smoney(sum(b.unc))})</div>`;
    h+=`<div class="actions"><button class="btn sm" onclick="goReconcile('${a.id}')">Pointer</button><button class="btn sm sec" onclick="bankModal('${a.id}')">Réel banque</button><button class="btn sm sec" onclick="goAcc('${a.id}')">Opérations</button></div></div>`;
  });
  h+=`<button class="btn sec" style="width:100%" onclick="accountModal()">+ Ajouter un compte</button>`;
  return h;
}
function goReconcile(id){ui.accFilter=id;ui.unc=true;ui.q='';ui.limit=100;go('tx')}
function goAcc(id){ui.accFilter=id;ui.unc=false;ui.q='';ui.limit=100;go('tx')}

function accountModal(id){
  const a=id?S.accounts.find(x=>x.id===id):null;
  modal(`<h3>${a?'Modifier le compte':'Nouveau compte'}</h3>
  <label>Nom<input id="a_name" value="${esc(a?a.name:'')}" placeholder="Compte courant"></label>
  <label>Type<select id="a_type">${optHTML(TYPES,a?a.type:'checking')}</select></label>
  <label>Solde de départ (avant les opérations saisies)<input id="a_init" inputmode="decimal" value="${a?String(a.initial_balance).replace('.',','):'0'}"></label>
  ${a?'':`<label>Solde réel banque (optionnel)<input id="a_bank" inputmode="decimal" placeholder="ex. 1 250,40"></label>`}
  <div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveAccount('${id||''}')">Enregistrer</button></div>
  ${a?`<div class="actions"><button class="btn sec" onclick="archiveAccount('${a.id}')">${a.archived?'Désarchiver':'Archiver'}</button><button class="btn danger" onclick="deleteAccount('${a.id}')">Supprimer</button></div>`:''}`);
}
function saveAccount(id){
  const name=$('#a_name').value.trim();if(!name){toast('Donne un nom au compte');return}
  const init=parseAmount($('#a_init').value);
  const a=id?S.accounts.find(x=>x.id===id):{id:uid(),bank_balance:null,bank_balance_date:null,archived:false,deleted:false};
  a.name=name;a.type=$('#a_type').value;a.initial_balance=isNaN(init)?0:r2(init);
  if(!id&&$('#a_bank')){const bb=parseAmount($('#a_bank').value);if(!isNaN(bb)){a.bank_balance=r2(bb);a.bank_balance_date=today()}}
  put('accounts',a);closeModal();render();
}
function archiveAccount(id){const a=S.accounts.find(x=>x.id===id);a.archived=!a.archived;put('accounts',a);closeModal();render()}
function deleteAccount(id){
  if(!confirm('Supprimer ce compte et toutes ses opérations ?'))return;
  live(S.transactions).filter(t=>t.account_id===id).forEach(t=>{t.deleted=true;t.updated_at=now()});
  del('accounts',id);if(ui.accFilter===id)ui.accFilter='';closeModal();render();
}
function bankModal(id){
  const a=S.accounts.find(x=>x.id===id);
  modal(`<h3>Réel banque · ${esc(a.name)}</h3><p class="mut">Saisis le solde affiché par ta banque (appli ou relevé). Il sera comparé au solde pointé.</p>
  <label>Solde bancaire<input id="b_amt" inputmode="decimal" value="${a.bank_balance!=null?String(a.bank_balance).replace('.',','):''}"></label>
  <label>Date du relevé<input id="b_date" type="date" value="${a.bank_balance_date||today()}"></label>
  <div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveBank('${id}')">Enregistrer</button></div>`);
}
function saveBank(id){
  const a=S.accounts.find(x=>x.id===id);const v=parseAmount($('#b_amt').value);
  if(isNaN(v)){toast('Montant invalide');return}
  a.bank_balance=r2(v);a.bank_balance_date=$('#b_date').value||today();put('accounts',a);closeModal();render();
}

/* ---- Opérations ---- */
function filteredTx(){
  const q=ui.q.trim().toLowerCase();const qn=parseAmount(q);
  let a=live(S.transactions);
  if(ui.accFilter)a=a.filter(t=>t.account_id===ui.accFilter);
  if(ui.unc)a=a.filter(t=>!t.cleared);
  if(q)a=a.filter(t=>(t.label||'').toLowerCase().includes(q)||catName(t.category_id).toLowerCase().includes(q)||(t.notes||'').toLowerCase().includes(q)||t.date.includes(q)||(!isNaN(qn)&&Math.abs(Math.abs(t.amount)-Math.abs(qn))<0.005));
  return a.sort((x,y)=>y.date.localeCompare(x.date)||y.updated_at-x.updated_at);
}
function txListHTML(){
  const all=filteredTx();
  if(!all.length)return`<div class="empty"><p>Aucune opération.</p></div>`;
  const a=all.slice(0,ui.limit);let h='',last='';
  a.forEach(t=>{
    if(t.date!==last){h+=`<div class="day">${esc(dayLabel(t.date))}</div>`;last=t.date}
    const sub=t.transfer_id?'↔ Virement':catIcon(t.category_id)+' '+catName(t.category_id);
    h+=`<div class="tx" onclick="txModal('${t.id}')"><button class="chk ${t.cleared?'on':''}" onclick="event.stopPropagation();toggleCleared('${t.id}')">✓</button>
    <div class="mid"><div class="t">${esc(t.label||'(sans libellé)')}</div><div class="s">${esc(sub)} · ${esc(accName(t.account_id))}</div></div>
    <div class="amt ${t.amount>=0?'pos':'neg'}">${smoney(t.amount)}</div></div>`;
  });
  if(all.length>a.length)h+=`<button class="btn sec" style="width:100%;margin-top:10px" onclick="ui.limit+=100;render()">Afficher plus (${all.length-a.length})</button>`;
  return h;
}
function viewTx(){
  const accs=live(S.accounts);
  let banner='';
  const acc=ui.accFilter?accs.find(x=>x.id===ui.accFilter):null;
  if(acc){
    const b=bal(acc);const gap=acc.bank_balance!=null?r2(acc.bank_balance-b.cleared):null;
    banner=`<div class="card"><div class="grid2" style="margin-top:0"><div><span class="label">Solde actuel</span><b>${money(b.current)}</b></div><div><span class="label">Pointé</span><b>${money(b.cleared)}</b></div>
    <div><span class="label">Réel banque</span><b>${acc.bank_balance!=null?money(acc.bank_balance):'—'}</b></div><div><span class="label">Écart</span><b class="${gap===0?'pos':'warn'}">${gap==null?'—':smoney(gap)}</b></div></div></div>`;
  }
  return`<div class="filters"><select onchange="ui.accFilter=this.value;ui.limit=100;render()"><option value="">Tous les comptes</option>${optHTML(accs.map(a=>[a.id,a.name]),ui.accFilter)}</select>
  <button class="chip ${ui.unc?'on':''}" onclick="ui.unc=!ui.unc;ui.limit=100;render()">À pointer</button></div>
  <input type="search" placeholder="Rechercher (libellé, montant, catégorie, date)…" value="${esc(ui.q)}" oninput="ui.q=this.value;ui.limit=100;$('#txlist').innerHTML=txListHTML()">
  ${banner}<div id="txlist">${txListHTML()}</div>`;

function toggleCleared(id){const t=S.transactions.find(x=>x.id===id);t.cleared=!t.cleared;put('transactions',t);render()}

const catOpts=(kind,sel)=>'<option value="">Sans catégorie</option>'+optHTML(live(S.categories).filter(c=>c.kind===kind).map(c=>[c.id,c.icon+' '+c.name]),sel);
function txModal(id){
  const accsAll=live(S.accounts);
  const accs=accsAll.filter(a=>!a.archived);
  if(!accs.length){toast("Ajoute d'abord un compte");accountModal();return}
  const t=id?S.transactions.find(x=>x.id===id):null;
  let type='expense',acc=(ui.accFilter&&accs.some(a=>a.id===ui.accFilter))?ui.accFilter:accs[0].id,to='',amt='',label='',date=today(),cat='',notes='',clr=false;
  if(t){
    amt=Math.abs(t.amount);label=t.label||'';date=t.date;cat=t.category_id||'';notes=t.notes||'';clr=!!t.cleared;acc=t.account_id;
    if(t.transfer_id){
      type='transfer';
      const legs=live(S.transactions).filter(x=>x.transfer_id===t.transfer_id);
      const o=legs.find(x=>x.amount<0)||t,i=legs.find(x=>x.amount>0)||t;
      acc=o.account_id;to=i.account_id;amt=Math.abs(o.amount);
    }else type=t.amount>=0?'income':'expense';
  }
  if(!to){const other=accs.find(a=>a.id!==acc);to=other?other.id:''}
  ui.txId=id||null;ui.txType=type;ui.txCat=cat;
  const accList=(accsAll.filter(a=>!a.archived||a.id===acc||a.id===to)).map(a=>[a.id,a.name]);
  let seg='';
  if(!t)seg=`<div class="seg" id="seg"><button data-v="expense" onclick="setType('expense')">Dépense</button><button data-v="income" onclick="setType('income')">Revenu</button><button data-v="transfer" onclick="setType('transfer')">Virement</button></div>`;
  else if(type!=='transfer')seg=`<div class="seg" id="seg"><button data-v="expense" onclick="setType('expense')">Dépense</button><button data-v="income" onclick="setType('income')">Revenu</button></div>`;
  modal(`<h3>${t?'Modifier l’opération':'Nouvelle opération'}</h3>${seg}
  <label>Montant<input id="f_amt" inputmode="decimal" value="${amt!==''?String(amt).replace('.',','):''}" placeholder="0,00"></label>
  <label>Libellé<input id="f_label" value="${esc(label)}" placeholder="Ex. Carrefour"></label>
  <label>Date<input id="f_date" type="date" value="${date}"></label>
  <label><span id="l_acc_t">Compte</span><select id="f_acc">${optHTML(accList,acc)}</select></label>
  <label id="l_to">Vers le compte<select id="f_to">${optHTML(accList,to)}</select></label>
  <label id="l_cat">Catégorie<select id="f_cat"></select></label>
  <label>Note / tag<input id="f_notes" value="${esc(notes)}"></label>
  <label class="chkl"><input type="checkbox" id="f_clr" ${clr?'checked':''}> Pointé (vu sur le relevé de la banque)</label>
  <div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveTx()">Enregistrer</button></div>
  ${t?`<div class="actions"><button class="btn danger" onclick="deleteTx('${t.id}')">Supprimer</button></div>`:''}`);
  setType(type);
}
function setType(v){
  if(ui.txType!==v&&$('#f_cat'))ui.txCat=$('#f_cat').value;
  ui.txType=v;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#l_to').style.display=v==='transfer'?'block':'none';
  $('#l_cat').style.display=v==='transfer'?'none':'block';
  $('#l_acc_t').textContent=v==='transfer'?'Depuis le compte':'Compte';
  const kind=v==='income'?'income':'expense';
  const c=catById(ui.txCat);
  $('#f_cat').innerHTML=catOpts(kind,c&&c.kind===kind?ui.txCat:'');
}
function saveTx(){
  const id=ui.txId,type=ui.txType;
  let amt=parseAmount($('#f_amt').value);
  if(!isFinite(amt)||amt===0){toast('Montant invalide');return}
  amt=Math.abs(r2(amt));
  const date=$('#f_date').value||today(),label=$('#f_label').value.trim(),notes=$('#f_notes').value.trim(),clr=$('#f_clr').checked,acc=$('#f_acc').value;
  if(type==='transfer'){
    const to=$('#f_to').value;
    if(!to||to===acc){toast('Choisis deux comptes différents');return}
    let outT=null,inT=null,opened=null;
    if(id){
      opened=S.transactions.find(x=>x.id===id);
      const legs=live(S.transactions).filter(x=>x.transfer_id===opened.transfer_id);
      outT=legs.find(x=>x.amount<0);inT=legs.find(x=>x.amount>0);
    }
    const tid=outT?outT.transfer_id:(inT?inT.transfer_id:uid());
    const mk=()=>({id:uid(),transfer_id:tid,category_id:null,recurring_id:null,deleted:false,cleared:clr,notes:''});
    const newOut=!outT,newIn=!inT;
    outT=outT||mk();inT=inT||mk();
    Object.assign(outT,{account_id:acc,date,amount:-amt,label:label||'Virement',notes});
    Object.assign(inT,{account_id:to,date,amount:amt,label:label||'Virement',notes});
    if(opened){if(opened.id===outT.id)outT.cleared=clr;if(opened.id===inT.id)inT.cleared=clr}
    else{outT.cleared=clr;inT.cleared=clr}
    put('transactions',outT,true);put('transactions',inT);
  }else{
    const t=id?S.transactions.find(x=>x.id===id):{id:uid(),transfer_id:null,recurring_id:null,deleted:false};
    Object.assign(t,{account_id:acc,date,amount:type==='income'?amt:-amt,label,category_id:$('#f_cat').value||null,notes,cleared:clr});
    put('transactions',t);
  }
  closeModal();render();
}
function deleteTx(id){
  const t=S.transactions.find(x=>x.id===id);
  if(!confirm(t.transfer_id?'Supprimer ce virement (les deux opérations) ?':'Supprimer cette opération ?'))return;
  if(t.transfer_id)live(S.transactions).filter(x=>x.transfer_id===t.transfer_id).forEach(x=>{x.deleted=true;x.updated_at=now()});
  else{t.deleted=true;t.updated_at=now()}
  persist();closeModal();render();
}

/* ---- Budgets ---- */
function viewBudgets(){
  const bs=live(S.budgets);
  let h=mnav();
  if(!bs.length)return h+`<div class="empty"><div class="big">🎯</div><p>Crée un budget mensuel par catégorie pour savoir ce qu’il te reste à dépenser.</p><button class="btn" onclick="budgetModal()">Ajouter un budget</button></div>`;
  const rows=bs.map(b=>({b,s:spentBy(b.category_id,ui.month)}));
  const tb=r2(rows.reduce((s,r)=>s+r.b.amount,0)),ts=r2(rows.reduce((s,r)=>s+r.s,0));
  h+=`<div class="card"><div class="grid2" style="margin-top:0"><div><span class="label">Budgété</span><b>${money(tb)}</b></div><div><span class="label">Dépensé</span><b>${money(ts)}</b></div></div>
  <div class="bar"><i class="${ts>tb?'over':ts>tb*.8?'warn':''}" style="width:${tb>0?Math.min(100,ts/tb*100):0}%"></i></div>
  <b class="${tb-ts<0?'neg':'pos'}">${tb-ts>=0?'Reste ':'Dépassement '}${money(Math.abs(r2(tb-ts)))}</b></div>`;
  const over=rows.filter(r=>r.s>r.b.amount);
  if(over.length)h+=`<div class="badge ko">⚠️ Dépassement : ${over.map(r=>esc(catName(r.b.category_id))+' (+'+money(r2(r.s-r.b.amount))+')').join(', ')}</div>`;
  rows.sort((x,y)=>(y.s/(y.b.amount||1))-(x.s/(x.b.amount||1))).forEach(({b,s})=>{
    const p=b.amount>0?s/b.amount:0;
    h+=`<div class="card" onclick="budgetModal('${b.id}')"><div class="row"><b>${esc(catIcon(b.category_id))} ${esc(catName(b.category_id))}</b><span>${money(s)} / ${money(b.amount)}</span></div>
    <div class="bar"><i class="${p>1?'over':p>.8?'warn':''}" style="width:${Math.min(100,p*100)}%"></i></div>
    <span class="${b.amount-s<0?'neg':'mut'}">${b.amount-s>=0?'Reste '+money(r2(b.amount-s)):'Dépassé de '+money(r2(s-b.amount))}</span></div>`;
  });
  return h;
}
function budgetModal(id){
  const b=id?S.budgets.find(x=>x.id===id):null;
  const used=new Set(live(S.budgets).map(x=>x.category_id));
  const cats=live(S.categories).filter(c=>c.kind==='expense'&&(!used.has(c.id)||(b&&b.category_id===c.id)));
  if(!b&&!cats.length){toast('Toutes les catégories ont déjà un budget');return}
  modal(`<h3>${b?'Modifier le budget':'Nouveau budget mensuel'}</h3>
  <label>Catégorie<select id="g_cat">${optHTML(cats.map(c=>[c.id,c.icon+' '+c.name]),b?b.category_id:'')}</select></label>
  <label>Montant par mois<input id="g_amt" inputmode="decimal" value="${b?String(b.amount).replace('.',','):''}" placeholder="500"></label>
  <div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveBudget('${id||''}')">Enregistrer</button></div>
  ${b?`<div class="actions"><button class="btn danger" onclick="deleteBudget('${b.id}')">Supprimer</button></div>`:''}`);
}
function saveBudget(id){
  const v=parseAmount($('#g_amt').value);if(!isFinite(v)||v<=0){toast('Montant invalide');return}
  const b=id?S.budgets.find(x=>x.id===id):{id:uid(),deleted:false};
  b.category_id=$('#g_cat').value;b.amount=r2(v);put('budgets',b);closeModal();render();
}
function deleteBudget(id){if(!confirm('Supprimer ce budget ?'))return;del('budgets',id);closeModal();render()}

/* ---- Analyses ---- */
function viewStats(){
  let h=mnav();
  const months=[];for(let i=5;i>=0;i--)months.push(addMonths(ui.month,-i));
  const data=months.map(m=>({m,...monthSums(m)}));
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const W=340,H=130,gw=W/6;
  let svg=`<svg viewBox="0 0 ${W} ${H+24}" width="100%">`;
  data.forEach((d,i)=>{
    const x=i*gw+gw/2,hi=d.inc/max*H,he=d.exp/max*H;
    svg+=`<rect x="${x-14}" y="${H-hi}" width="13" height="${hi}" rx="3" fill="var(--pos)"/><rect x="${x+1}" y="${H-he}" width="13" height="${he}" rx="3" fill="var(--neg)"/><text x="${x}" y="${H+14}" text-anchor="middle">${esc(monthShort(d.m))}</text>`;
  });
  svg+='</svg>';
  const cur=data[5];
  h+=`<div class="card"><b>Revenus et dépenses</b>${svg}<div class="mut"><span class="pos">■</span> Revenus <span class="neg">■</span> Dépenses</div>
  <div class="grid2"><div><span class="label">Revenus</span><b class="pos">${money(cur.inc)}</b></div><div><span class="label">Dépenses</span><b class="neg">${money(cur.exp)}</b></div></div>
  <div style="margin-top:8px"><span class="label">Solde du mois</span><b class="${cur.inc-cur.exp<0?'neg':'pos'}">${smoney(r2(cur.inc-cur.exp))}</b></div></div>`;
  const nets=months.map(m=>netAt(m+'-31'));
  const mn=Math.min(...nets),mx=Math.max(...nets),rg=(mx-mn)||1;
  const pts=nets.map((v,i)=>`${(i*gw+gw/2).toFixed(1)},${(H-(v-mn)/rg*(H-10)-5).toFixed(1)}`).join(' ');
  let svg2=`<svg viewBox="0 0 ${W} ${H+24}" width="100%"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/>`;
  nets.forEach((v,i)=>{svg2+=`<circle cx="${i*gw+gw/2}" cy="${(H-(v-mn)/rg*(H-10)-5).toFixed(1)}" r="3.5" fill="var(--acc)"/><text x="${i*gw+gw/2}" y="${H+14}" text-anchor="middle">${esc(monthShort(months[i]))}</text>`});
  svg2+='</svg>';
  h+=`<div class="card"><b>Patrimoine net (fin de mois)</b>${svg2}<span class="mut">Fin ${esc(monthLabel(ui.month))} : ${money(nets[5])}</span></div>`;
  const by={};
  live(S.transactions).forEach(t=>{if(t.transfer_id||t.amount>=0||ym(t.date)!==ui.month)return;const k=t.category_id||'';by[k]=(by[k]||0)-t.amount});
  const arr=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const tot=arr.reduce((s,a)=>s+a[1],0);
  h+=`<div class="card"><b>Dépenses par catégorie</b>`;
  if(!arr.length)h+=`<p class="mut">Aucune dépense ce mois-ci.</p>`;
  arr.forEach(([k,v])=>{h+=`<div style="margin-top:10px"><div class="row"><span>${esc(catIcon(k))} ${esc(catName(k))}</span><span>${money(r2(v))} · ${Math.round(v/tot*100)}%</span></div><div class="bar"><i style="width:${v/arr[0][1]*100}%"></i></div></div>`});
  return h+'</div>';
}

function viewGoals(){
  const g=live(S.goals);

function goalModal(id){

function saveGoal(id){
  const name=$('#o_name').value.trim(),t=parseAmount($('#o_target').value);
  if(!name||!isFinite(t)||t<=0){toast('Nom et montant requis');return}
  let s=parseAmount($('#o_saved').value);if(!isFinite(s))s=0;
  if($('#o_add')){const a=parseAmount($('#o_add').value);if(isFinite(a))s+=a}
  const g=id?S.goals.find(x=>x.id===id):{id:uid(),deleted:false};
  Object.assign(g,{name,target:r2(t),saved:r2(s),deadline:$('#o_dl').value||null});
  put('goals',g);closeModal();render();
}

  h+=`<div class="card"><span class="label">Charges mensuelles récurrentes</span><div class="big">${money(monthly)}</div></div>`;

  rs.forEach(r=>{
    const booked=recBooked(r);
    h+=`<div class="card"><div class="row" onclick="recModal('${r.id}')"><div><b>${esc(r.label)}</b>${r.active?'':' <span class="chip">inactif</span>'}<div class="mut">le ${r.day} · ${esc(accName(r.account_id))}</div></div><b class="${r.amount>=0?'pos':'neg'}">${smoney(r.amount)}</b></div>

  });
  return h;
}
function recModal(id){
  const r=id?S.recurring.find(x=>x.id===id):null;
  const accs=live(S.accounts).filter(a=>!a.archived);
  if(!accs.length){toast("Ajoute d'abord un compte");return}
  const kind=r&&r.amount>0?'income':'expense';
  modal(`<h3>${r?'Modifier':'Nouveau récurrent'}</h3>
  <div class="seg" id="rseg"><button data-v="expense" class="${kind==='expense'?'on':''}" onclick="setRecKind('expense')">Dépense</button><button data-v="income" class="${kind==='income'?'on':''}" onclick="setRecKind('income')">Revenu</button></div>
  <label>Libellé<input id="r_label" value="${esc(r?r.label:'')}" placeholder="Netflix"></label>
  <label>Montant<input id="r_amt" inputmode="decimal" value="${r?String(Math.abs(r.amount)).replace('.',','):''}"></label>
  <label>Jour du mois<input id="r_day" type="number" min="1" max="31" value="${r?r.day:1}"></label>
  <label>Compte<select id="r_acc">${optHTML(accs.map(a=>[a.id,a.name]),r?r.account_id:accs[0].id)}</select></label>
  <label>Catégorie<select id="r_cat"></select></label>
  <label class="chkl"><input type="checkbox" id="r_act" ${!r||r.active?'checked':''}> Actif</label>
  <div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveRec('${id||''}')">Enregistrer</button></div>
  ${r?`<div class="actions"><button class="btn danger" onclick="if(confirm('Supprimer ?')){del('recurring','${r.id}');closeModal();render()}">Supprimer</button></div>`:''}`);
  ui.recKind=kind;ui.recCat=r?r.category_id||'':'';setRecKind(kind);
}
function setRecKind(k){
  if(ui.recKind!==k&&$('#r_cat'))ui.recCat=$('#r_cat').value;
  ui.recKind=k;
  document.querySelectorAll('#rseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===k));
  const c=catById(ui.recCat);$('#r_cat').innerHTML=catOpts(k,c&&c.kind===k?ui.recCat:'');
}
function saveRec(id){
  const label=$('#r_label').value.trim();let a=parseAmount($('#r_amt').value);
  if(!label||!isFinite(a)||a===0){toast('Libellé et montant requis');return}
  const day=Math.min(31,Math.max(1,parseInt($('#r_day').value)||1));
  const r=id?S.recurring.find(x=>x.id===id):{id:uid(),deleted:false};
  Object.assign(r,{label,amount:ui.recKind==='income'?Math.abs(r2(a)):-Math.abs(r2(a)),day,account_id:$('#r_acc').value,category_id:$('#r_cat').value||null,active:$('#r_act').checked});
  put('recurring',r);closeModal();render();
}
function addRecurring(id){
  const r=S.recurring.find(x=>x.id===id);
  put('transactions',{id:uid(),account_id:r.account_id,date:recDate(r),amount:r.amount,label:r.label,category_id:r.category_id,notes:'',cleared:false,transfer_id:null,recurring_id:r.id,deleted:false});
  toast('Opération ajoutée');render();
}
function viewCategories(){
  let h=`<div class="row"><h3>Catégories</h3><button class="btn sm" onclick="catModal()">+ Ajouter</button></div>`;
  [['expense','Dépenses'],['income','Revenus']].forEach(([k,l])=>{
    h+=`<div class="day">${l}</div>`;
    live(S.categories).filter(c=>c.kind===k).forEach(c=>{h+=`<div class="tx" onclick="catModal('${c.id}')"><span style="font-size:22px">${esc(c.icon)}</span><div class="mid">${esc(c.name)}</div></div>`});
  });
  return h;
}
function catModal(id){
  const c=id?S.categories.find(x=>x.id===id):null;
  modal(`<h3>${c?'Modifier la catégorie':'Nouvelle catégorie'}</h3>
  <label>Icône (emoji)<input id="c_icon" value="${esc(c?c.icon:'📦')}" maxlength="4"></label>
  <label>Nom<input id="c_name" value="${esc(c?c.name:'')}"></label>
  <label>Type<select id="c_kind">${optHTML([['expense','Dépense'],['income','Revenu']],c?c.kind:'expense')}</select></label>
  <div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveCat('${id||''}')">Enregistrer</button></div>
  ${c?`<div class="actions"><button class="btn danger" onclick="if(confirm('Supprimer cette catégorie ?')){del('categories','${c.id}');closeModal();render()}">Supprimer</button></div>`:''}`);
}
function saveCat(id){
  const name=$('#c_name').value.trim();if(!name){toast('Nom requis');return}
  const c=id?S.categories.find(x=>x.id===id):{id:uid(),deleted:false};
  Object.assign(c,{name,icon:$('#c_icon').value.trim()||'📦',kind:$('#c_kind').value});
  put('categories',c);closeModal();render();
}

/* ---- Import / export ---- */
function viewData(){
  return`<h3>Import / export</h3>
  <div class="card"><b>Importer un CSV de ta banque</b><p class="mut">Exporte tes opérations depuis le site de ta banque (CSV), puis choisis le fichier. Les doublons sont ignorés.</p>
  <input type="file" accept=".csv,.txt,.tsv,text/csv" onchange="importFile(this)"></div>
  <div class="card"><b>Exporter les opérations (CSV)</b><div class="actions"><button class="btn sec" onclick="exportCSV()">Télécharger le CSV</button></div></div>
  <div class="card"><b>Sauvegarde complète (JSON)</b><div class="actions"><button class="btn sec" onclick="exportJSON()">Sauvegarder</button></div>
  <p class="mut">Restaurer depuis une sauvegarde :</p><input type="file" accept=".json,application/json" onchange="importJSON(this)"></div>`;
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function exportCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=['Date;Compte;Libellé;Catégorie;Montant;Pointé;Note'];
  filterAll().forEach(t=>lines.push([t.date,q(accName(t.account_id)),q(t.label),q(t.transfer_id?'Virement':catName(t.category_id)),String(t.amount).replace('.',','),t.cleared?'oui':'non',q(t.notes)].join(';')));
  download('operations.csv','\uFEFF'+lines.join('\n'),'text/csv');
}
const filterAll=()=>live(S.transactions).sort((a,b)=>a.date.localeCompare(b.date));
function exportJSON(){download('prisme-sauvegarde-'+today()+'.json',JSON.stringify(S,null,1),'application/json')}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.accounts))throw 0;
    if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;
    TABLES.forEach(t=>{S[t]=Array.isArray(d[t])?d[t]:[]});CFG.lastPush=0;saveCfg();persist();toast('Sauvegarde restaurée');render();
  }catch(e){toast('Fichier invalide')}};
  rd.readAsText(f);inp.value='';
}
function importFile(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let text;
    try{text=new TextDecoder('utf-8',{fatal:true}).decode(rd.result)}catch(e){text=new TextDecoder('windows-1252').decode(rd.result)}
    const rows=parseCSV(text);
    if(rows.length<2){toast('Fichier vide ou illisible');return}
    ui.imp={rows};importModal();
  };
  rd.readAsArrayBuffer(f);inp.value='';
}
function importModal(){
  const rows=ui.imp.rows,head=rows[0];
  const g=re=>{const i=head.findIndex(h=>re.test(String(h).toLowerCase()));return i};
  const gd=g(/date/),gl=g(/libell|label|description|intitul|objet|detail|détail/),ga=g(/^montant|amount|valeur/),gdb=g(/d[ée]bit/),gcr=g(/cr[ée]dit/);
  const colOpts=sel=>'<option value="-1">—</option>'+head.map((h,i)=>`<option value="${i}"${i===sel?' selected':''}>${esc(String(h)||('Colonne '+(i+1)))}</option>`).join('');
  const accs=live(S.accounts).filter(a=>!a.archived);
  if(!accs.length){toast("Ajoute d'abord un compte");return}
  modal(`<h3>Importer ${rows.length-1} ligne(s)</h3>
  <label>Compte de destination<select id="i_acc">${optHTML(accs.map(a=>[a.id,a.name]),ui.accFilter||accs[0].id)}</select></label>
  <label>Colonne Date<select id="i_d">${colOpts(gd)}</select></label>
  <label>Colonne Libellé<select id="i_l">${colOpts(gl)}</select></label>
  <label>Colonne Montant (signé)<select id="i_a">${colOpts(ga)}</select></label>
  <label>…ou colonne Débit<select id="i_db">${colOpts(gdb)}</select></label>
  <label>…et colonne Crédit<select id="i_cr">${colOpts(gcr)}</select></label>
  <label class="chkl"><input type="checkbox" id="i_clr" checked> Marquer comme pointées (elles viennent de la banque)</label>
  <p class="mut">Exemple 1re ligne : ${esc(rows[1].join(' | ').slice(0,140))}</p>
  <div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="runImport()">Importer</button></div>`);
}
function runImport(){
  const rows=ui.imp.rows.slice(1);
  const d=+$('#i_d').value,l=+$('#i_l').value,a=+$('#i_a').value,db=+$('#i_db').value,cr=+$('#i_cr').value,acc=$('#i_acc').value,clr=$('#i_clr').checked;
  if(d<0||(a<0&&db<0&&cr<0)){toast('Choisis au moins la date et le montant');return}
  const key=(date,amt,lab)=>acc+'|'+date+'|'+r2(amt)+'|'+String(lab).toLowerCase().trim();
  const seen=new Set(live(S.transactions).filter(t=>t.account_id===acc).map(t=>key(t.date,t.amount,t.label||'')));
  let n=0,skip=0;
  rows.forEach(r=>{
    const date=parseDate(r[d]);let amt;
    if(a>=0)amt=parseAmount(r[a]);
    else{
      const dv=db>=0?parseAmount(r[db]):NaN,cv=cr>=0?parseAmount(r[cr]):NaN;
      amt=(isNaN(dv)&&isNaN(cv))?NaN:(isNaN(cv)?0:cv)-(isNaN(dv)?0:Math.abs(dv));
    }
    if(!date||!isFinite(amt)||amt===0){skip++;return}
    const label=l>=0?String(r[l]||'').trim():'';
    const k=key(date,amt,label);
    if(seen.has(k)){skip++;return}
    seen.add(k);
    put('transactions',{id:uid(),account_id:acc,date,amount:r2(amt),label,category_id:null,notes:'',cleared:clr,transfer_id:null,recurring_id:null,deleted:false},true);
    n++;
  });
  persist();closeModal();ui.imp=null;toast(n+' importée(s), '+skip+' ignorée(s)');render();
}

/* ============ Synchronisation Supabase ============ */
let sb=null,syncing=false,syncMsg='',syncOk=null,syncTimer=null;
function loadSB(){
  if(window.supabase)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';s.onload=res;s.onerror=()=>rej(new Error('Impossible de charger supabase-js (connexion ?)'));document.head.appendChild(s)});
}
async function sbClient(){
  if(!CFG.url||!CFG.key)throw new Error('URL et clé Supabase à renseigner');
  const sig=CFG.url+'|'+CFG.key;
  if(sb&&sb._sig===sig)return sb;
  await loadSB();
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'prisme_auth'}});
  sb._sig=sig;return sb;
}
function updateDot(){
  const d=$('#dot');if(!d)return;
  d.style.background=!CFG.url?'#94a3b8':syncing?'#6366f1':syncOk===false?'#dc2626':syncOk?'#16a34a':'#d97706';
  d.title=syncMsg||(CFG.url?'Supabase configuré':'Mode local');
  const s=$('#syncstat');if(s)s.textContent=syncMsg||'—';
}
function setStatus(m,ok){syncMsg=m;if(ok!==undefined)syncOk=ok;updateDot()}
function scheduleSync(){
  if(!CFG.auto||!CFG.url||!CFG.key||!CFG.email)return;
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),2500);
}
function manualSync(){
  if(!CFG.url){ui.tab='more';ui.sub='sync';render();return}
  sync(true);
}
async function sync(manual){
  if(syncing||!CFG.url||!CFG.key)return;
  syncing=true;setStatus('Synchronisation…');
  try{
    const c=await sbClient();
    const {data:{session}}=await c.auth.getSession();
    if(!session)throw new Error('Non connecté : ouvre Plus › Synchronisation');
    const user=session.user.id,startPush=now();
    let maxPull=CFG.lastPull||0;
    for(const t of TABLES){
      let from=0;
      while(true){
        const {data,error}=await c.from(t).select('*').gt('updated_at',CFG.lastPull||0).order('updated_at',{ascending:true}).order('id',{ascending:true}).range(from,from+999);
        if(error)throw error;
        data.forEach(r=>{
          maxPull=Math.max(maxPull,r.updated_at);
          const loc=S[t].find(x=>x.id===r.id);
          if(!loc||loc.updated_at<r.updated_at){const o={...r};delete o.user_id;if(loc)Object.assign(loc,o);else S[t].push(o)}
        });
        if(data.length<1000)break;
        from+=1000;
      }
    }
    for(const t of TABLES){
      const rows=S[t].filter(x=>x.updated_at>(CFG.lastPush||0)).map(x=>({...x,user_id:user}));
      for(let i=0;i<rows.length;i+=500){
        const {error}=await c.from(t).upsert(rows.slice(i,i+500));
        if(error)throw error;
      }
    }
    CFG.lastPull=maxPull;CFG.lastPush=startPush;saveCfg();saveData();
    setStatus('Synchronisé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),true);
    if(!$('#modal').classList.contains('open'))render();
    if(manual)toast('Synchronisation terminée');
  }catch(e){
    setStatus('Erreur : '+(e.message||e),false);
    if(manual)toast('Échec : '+(e.message||e));
  }finally{syncing=false;updateDot()}
}
function readSyncFields(){
  CFG.url=$('#s_url').value.trim().replace(/\/+$/,'');CFG.key=$('#s_key').value.trim();CFG.email=$('#s_mail').value.trim();saveCfg();
}
async function sbLogin(){
  try{
    readSyncFields();const pw=$('#s_pw').value;
    if(!CFG.email||!pw)throw new Error('E-mail et mot de passe requis');
    const c=await sbClient();
    const {error}=await c.auth.signInWithPassword({email:CFG.email,password:pw});
    if(error)throw error;
    toast('Connecté');await sync(true);render();
  }catch(e){toast(e.message||String(e))}
}
async function sbSignup(){
  try{
    readSyncFields();const pw=$('#s_pw').value;
    if(!CFG.email||pw.length<6)throw new Error('E-mail et mot de passe (6 caractères min.) requis');
    const c=await sbClient();
    const {data,error}=await c.auth.signUp({email:CFG.email,password:pw});
    if(error)throw error;
    if(data.session){toast('Compte créé et connecté');await sync(true);render()}
    else toast('Compte créé : confirme l’e-mail reçu, puis connecte-toi');
  }catch(e){toast(e.message||String(e))}
}
async function sbLogout(){
  try{const c=await sbClient();await c.auth.signOut()}catch(e){}
  CFG.lastPull=0;CFG.lastPush=0;saveCfg();setStatus('Déconnecté',null);toast('Déconnecté');render();
}
function viewSync(){
  return`<h3>Synchronisation Supabase</h3>
  <div class="card"><p class="mut">Les données restent d’abord sur cet appareil. Une fois connecté à ton projet Supabase, elles se synchronisent entre iPhone et iPad (voir <i>supabase-schema.sql</i> pour créer les tables).</p>
  <label>URL du projet<input id="s_url" value="${esc(CFG.url)}" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off"></label>
  <label>Clé anon / publishable<input id="s_key" value="${esc(CFG.key)}" autocapitalize="off" autocorrect="off"></label>
  <label>E-mail<input id="s_mail" type="email" value="${esc(CFG.email)}" autocapitalize="off"></label>
  <label>Mot de passe<input id="s_pw" type="password" autocomplete="current-password"></label>
  <div class="actions"><button class="btn" onclick="sbLogin()">Se connecter</button><button class="btn sec" onclick="sbSignup()">Créer le compte</button></div>
  <div class="actions"><button class="btn sec" onclick="readSyncFields();sync(true)">Synchroniser</button><button class="btn danger" onclick="sbLogout()">Se déconnecter</button></div>
  <label class="chkl" style="margin-top:14px"><input type="checkbox" ${CFG.auto?'checked':''} onchange="CFG.auto=this.checked;saveCfg()"> Synchroniser automatiquement après chaque modification</label>
  <p class="mut" id="syncstat">${esc(syncMsg||'—')}</p></div>`;
}

/* ============ Démarrage ============ */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleSync()});
render();
if(CFG.url&&CFG.key&&CFG.email)setTimeout(()=>sync(false),600);
</script>
